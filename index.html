<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weightage Calculator</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{background:#000;color:#fff}#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}#shade{position:fixed;inset:0;background:#0006;z-index:-2}.page{display:none;width:min(940px,100%);margin:auto;padding:20px 12px 40px}.active{display:block}.panel{background:#fff2;border:1px solid #fff5;backdrop-filter:blur(3px);border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.home{text-align:center;padding:45px 24px}h1{font-size:clamp(34px,7vw,60px);margin:0 0 10px}h2{font-size:clamp(25px,5vw,38px);margin:0 0 8px}.sub{opacity:.9;margin:0 0 25px}.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{font:inherit;border:0;border-radius:10px;cursor:pointer}.round{padding:20px;font-size:20px;font-weight:bold;background:#fffe;color:#111}.back{padding:10px 14px;background:#fffe;color:#111;font-weight:bold;margin-bottom:14px}.form{max-width:620px;margin:25px auto}.form label{display:block;font-weight:bold;margin-bottom:8px}input{font:inherit}.name{width:100%;padding:13px;border-radius:9px;border:2px solid #fff8;background:#fffe;color:#111;font-size:18px}.primary{background:#fff;color:#111;font-weight:bold;padding:13px 18px}.form .primary{width:100%;margin-top:12px}.error{display:none;color:#ffd0d0;font-weight:bold;margin-top:9px}.sheet{margin-top:22px}.sheet h3{margin-bottom:5px}.judgebox{background:#0004;border-radius:11px;padding:14px;margin:10px 0}.judgecount{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}.score{margin-top:13px;display:grid;grid-template-columns:1fr minmax(250px,330px);gap:12px;align-items:start}.scores{display:flex;flex-wrap:wrap;gap:7px}.scores input{width:70px;padding:9px;border-radius:8px;border:1px solid #fff8;background:#fffe;color:#111}.avg{font-size:13px;opacity:.85;margin-top:6px}.sheet-total{margin-top:10px;padding:10px;background:#fff2;border-radius:9px;font-weight:bold}.calc{width:100%;margin-top:25px;padding:16px;font-size:18px}.result{text-align:center;padding:40px 20px}.resultname{font-size:30px}.final{font-size:clamp(65px,15vw,120px);font-weight:900}.breakdown{text-align:left;margin-top:25px}.br{display:flex;justify-content:space-between;border-bottom:1px solid #fff3;padding:10px 0}.actions{display:flex;gap:10px;justify-content:center;margin-top:25px}.actions button{padding:12px 17px}.secondary{background:#fff2;color:#fff;border:1px solid #fff6}@media(max-width:650px){.rounds{grid-template-columns:1fr}.score{grid-template-columns:1fr}.judgecount{grid-template-columns:1fr 110px}.panel{padding:18px}}
</style></head><body><video id="bg" autoplay muted loop playsinline preload="auto"></video><div id="shade"></div><main>
<section id="home" class="page active"><div class="panel home"><h1>Weightage Calculator</h1><p class="sub">Select a round to begin scoring.</p><div class="rounds"><button class="round" onclick="start(1)">Round 1</button><button class="round" onclick="start(2)">Round 2</button><button class="round" onclick="start(3)">Round 3</button></div></div></section>
<section id="team" class="page"><div class="panel"><button class="back" onclick="home()">← Home</button><h2 id="teamTitle"></h2><p class="sub">Enter the team name to begin scoring.</p><div class="form"><label>Team name</label><input id="teamName" class="name" maxlength="100" placeholder="Enter team name"><button class="primary" onclick="begin()">Continue</button><div id="teamErr" class="error">Please enter a team name.</div></div></div></section>
<section id="score" class="page"><div class="panel"><button class="back" onclick="show('team')">← Back</button><h2 id="scoreTitle"></h2><p id="scoreTeam" class="sub"></p><div id="content"></div><div id="scoreErr" class="error"></div><button class="primary calc" onclick="calculate()">Calculate Final Percentage</button></div></section>
<section id="result" class="page"><div class="panel result"><h2>Final Result</h2><div id="resultTeam" class="resultname"></div><div id="final" class="final">0%</div><p>Final percentage for this round</p><div id="break" class="breakdown"></div><div class="actions"><button class="primary" onclick="start(round)">Score Another Team</button><button class="secondary" onclick="home()">Home</button></div></div></section></main>
<script>
const videos={home:'mosa2.mp4',1:'Adobe Express - trex1.mp4',2:'mosa1 (1).mp4',3:'pachy1 (1).mp4',result:'quetz1 (1).mp4'};
const data={1:{title:'Round 1 — The 3-Minute Elevator Pitch',sheets:[{id:'science',name:'Science Feasibility',weight:50,c:[['Concept Validity',25],['Technical Soundness',25]]},{id:'model',name:'Visual or Physical Model',weight:10,c:[['Visual or Physical Model',10]]},{id:'commercial',name:'Commercial Viability',weight:40,c:[['Market Problem Addressed',20],['Innovation',20]]}]},2:{title:'Round 2 — The Market Mutation',sheets:[{id:'r2',name:'Round 2 Scoring',weight:100,c:[['Grasp of the Weakness Raised',25],['Quality of Adaptation',25],['Feasibility of New Approach',25],['Composure Under Pressure',25]]}]},3:{title:'Round 3 — The Apex Pitch',sheets:[{id:'r3',name:'Round 3 Scoring',weight:100,c:[['Business Strategy & Budgeting',20],['Pricing Strategy',15],['Market Segmentation',15],['CSR vs. Commercial Clarity',10],['Presentation Quality',20],['Q&A Response',20]]}]}};
let round=1,team='';
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function vid(x){let v=document.getElementById('bg');if(v.src!==new URL(x,location.href).href){v.src=x;v.load();}v.play().catch(()=>{})}
function home(){vid(videos.home);document.getElementById('teamName').value='';show('home')}
function start(r){round=r;document.getElementById('teamTitle').textContent=data[r].title;document.getElementById('teamErr').style.display='none';vid(videos[r]);show('team');setTimeout(()=>document.getElementById('teamName').focus(),100)}
function begin(){let n=document.getElementById('teamName').value.trim();if(!n){document.getElementById('teamErr').style.display='block';return}team=n;document.getElementById('scoreTitle').textContent=data[round].title;document.getElementById('scoreTeam').textContent='Team: '+team;render();show('score')}
function render(){let box=document.getElementById('content');box.innerHTML='';data[round].sheets.forEach(s=>{let d=document.createElement('div');d.className='sheet';d.innerHTML=`<h3>${s.name}</h3><div>Sheet weight: ${s.weight}% of round</div><div class="judgebox"><div class="judgecount"><b>Number of judges</b><input id="j-${s.id}" type="number" min="1" max="50" value="1"></div><div id="rows-${s.id}"></div></div><div id="total-${s.id}" class="sheet-total">Sheet contribution: —</div>`;box.appendChild(d);document.getElementById('j-'+s.id).oninput=()=>rows(s);rows(s)})}
function rows(s){let n=Math.max(1,Math.min(50,parseInt(document.getElementById('j-'+s.id).value)||1)),h=document.getElementById('rows-'+s.id);h.innerHTML='';s.c.forEach((c,i)=>{let r=document.createElement('div');r.className='score';r.innerHTML=`<div><b>${c[0]}</b><div>${c[1]}% of total round</div><div id="a-${s.id}-${i}" class="avg">Average: —</div></div><div class="scores"></div>`;let z=r.lastElementChild;for(let j=1;j<=n;j++){let q=document.createElement('input');q.type='number';q.min=0;q.max=10;q.step=.01;q.placeholder='0–10';q.dataset.s=s.id;q.dataset.c=i;z.appendChild(q);q.oninput=()=>average(s,i)}h.appendChild(r)})}
function average(s,i){let a=[...document.querySelectorAll(`[data-s="${s.id}"][data-c="${i}"]`)].map(x=>x.value===''?null:+x.value).filter(x=>x!==null),e=document.getElementById(`a-${s.id}-${i}`);e.textContent=a.length?'Average: '+(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2)+' / 10':'Average: —'}
function calculate(){let total=0,bd=[],bad=false;for(const s of data[round].sheets){let n=+document.getElementById('j-'+s.id).value||1,sp=0;for(let i=0;i<s.c.length;i++){let ins=[...document.querySelectorAll(`[data-s="${s.id}"][data-c="${i}"]`)];if(ins.length!==n||ins.some(x=>x.value===''||+x.value<0||+x.value>10)){bad=true;break}let av=ins.reduce((a,x)=>a+(+x.value),0)/n;sp+=(av/10)*s.c[i][1]}if(bad)break;total+=sp;bd.push([s.name,sp,s.weight])}let er=document.getElementById('scoreErr');if(bad){er.textContent='Please enter a score from 0 to 10 for every judge on every criterion.';er.style.display='block';return}er.style.display='none';document.getElementById('resultTeam').textContent=team;document.getElementById('final').textContent=total.toFixed(2)+'%';let b=document.getElementById('break');b.innerHTML='<h3>Score breakdown</h3>'+bd.map(x=>`<div class="br"><span>${x[0]}</span><b>${x[1].toFixed(2)} / ${x[2]}</b></div>`).join('');vid(videos.result);show('result')}
vid(videos.home);document.getElementById('teamName').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
</script></body></html>
